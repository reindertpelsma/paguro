[package]
name = "paguro-fuzz"
license = "Apache-2.0"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
paguro-core = { path = "../crates/paguro-core" }
paguro-boot = { path = "../crates/paguro-boot" }

[build-dependencies]
cc = "1"

# Not part of the main workspace: cargo-fuzz needs nightly and sanitizers.
[workspace]
members = ["."]

[profile.release]
debug = 1

# ---- NTFS core (INTERFACES §10.1, §12) -------------------------------------
# Inputs share the sparse-volume format of paguro-harness's SparseDisk;
# seeds: kernel/dm-paguro/test/fuzz/corpus/ntfs (`paguro-harness ntfs-seeds`).

[[bin]]
name = "ntfs_file"
path = "fuzz_targets/ntfs_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runlist"
path = "fuzz_targets/runlist.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntfs_diff"
path = "fuzz_targets/ntfs_diff.rs"
test = false
doc = false
bench = false


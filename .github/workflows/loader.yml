name: loader

# paguro.efi and the crates behind it: paguro-core's loader-facing parsers,
# paguro-boot's stage machine, the UEFI adapter, fuzzing, and QEMU boots
# (INTERFACES.md §12).

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, unit + property + mock-boot + swtpm tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-uefi, aarch64-unknown-uefi
      # swtpm: real-TPM integration tests. The NTFS tools, mtools, gdisk and
      # qemu-img build the real volumes stage 4 is tested against.
      - name: install swtpm and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swtpm ntfs-3g attr mtools dosfstools gdisk qemu-utils
      - run: cargo fmt --all --check
      - run: cargo clippy -p paguro-core -p paguro-boot -p paguro-qemu --all-targets -- -D warnings
      - run: cargo clippy -p paguro-efi -p paguro-probe --target x86_64-unknown-uefi -- -D warnings
      - run: cargo clippy -p paguro-efi -p paguro-probe --target aarch64-unknown-uefi -- -D warnings
      - run: cargo clippy -p paguro-tablet-shim --target x86_64-unknown-uefi -- -D warnings
      - run: cargo test -p paguro-core -p paguro-boot
      - name: the real-volume NTFS tests really ran
        run: cargo test -p paguro-core --test ntfs_dir -- --nocapture 2>&1 | tee ntfs.log && ! grep -q "skipped" ntfs.log
      - name: swtpm tests really ran
        run: cargo test -p paguro-boot --test swtpm -- --nocapture 2>&1 | tee swtpm.log && ! grep -q "skipping real-TPM" swtpm.log

  efi:
    name: build paguro.efi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - run: cargo build --release -p paguro-efi --target x86_64-unknown-uefi
      - uses: actions/upload-artifact@v4
        with:
          name: paguro.efi
          path: target/x86_64-unknown-uefi/release/paguro.efi

  languages:
    name: PAGURO_LANG=${{ matrix.lang }} (loader build, every screen renders)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lang: [en, nl, de, fr, es]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - run: PAGURO_LANG=${{ matrix.lang }} cargo build --release -p paguro-efi --target x86_64-unknown-uefi
      # Goldens (every language's hashes included) run in the en build; other
      # starting languages must render every screen.
      - run: PAGURO_LANG=${{ matrix.lang }} cargo test -p paguro-ui --test golden --test layout_prop

  fuzz:
    name: fuzz ${{ matrix.target }} (60 s)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [ini_config, seal, fve, gpt, fat_dir, handoff, bootstrap, tpm_response, tpm_client, edid, vt100, ntfs_index, ntfs_lookup]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13
      - run: command -v cargo-fuzz || cargo install cargo-fuzz --locked
      - name: fuzz
        working-directory: fuzz
        run: |
          mkdir -p /tmp/corpus
          cargo +nightly fuzz run ${{ matrix.target }} /tmp/corpus corpus/${{ matrix.target }} -- -max_total_time=60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  bde:
    name: BitLocker reader = libbde = dislocker (INTERFACES §12.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install the oracles and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libbde-utils dislocker ntfs-3g fuse3 xz-utils gdisk mtools dosfstools qemu-utils
      - run: cargo build --release -p paguro-harness --bin paguro-bde-read --bin paguro-bde-write
      # The stage machine and stage 4 over make.sh-encrypted NTFS volumes.
      - run: cargo test -p paguro-boot --test bde_stage4 -- --nocapture 2>&1 | tee s4.log && ! grep -q "skipped" s4.log
      # Windows-made volumes and make.sh's generated ones, whole-volume
      # byte comparisons; root for the FUSE mounts.
      - run: sudo -E PAGURO_BDE_PREBUILT=1 test/fixtures/bde/diff.sh

  qemu:
    name: QEMU ${{ matrix.group }} (OVMF, Secure Boot, swtpm; AAVMF)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: stages 1-3, graphics
            scenarios: recovery-no-config load-taint-unseal sb-* graphical-unlock
          # Stage 4 end to end: one shared NTFS volume, a boot per scenario.
          - group: stage 4 boots
            scenarios: s4-vhd-gpt s4-superfloppy-raw-other s4-efi-file s4-root-frag s4-secure-boot s4-gates s4-aarch64
          - group: stage 4 refusals, recovery
            scenarios: s4-refusals s4-invalid-pe s4-volume-missing s4-recovery-browser
          # BitLocker: the stage-4 volume encrypted by make.sh; password,
          # recovery password, clear key, disagreeing metadata copies.
          - group: BitLocker
            scenarios: s4-bde-*
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi, aarch64-unknown-uefi
      # Stage 4 builds its NTFS volume with ntfs-3g (FUSE, through sudo -n),
      # its VHDs with qemu-img, and boots one scenario under AAVMF.
      - name: install QEMU, OVMF, AAVMF, swtpm, image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-arm qemu-efi-aarch64 qemu-utils \
            ovmf swtpm mtools dosfstools gdisk sbsigntool ntfs-3g attr
      # TCG: OVMF + swtpm under (nested) KVM intermittently stops receiving
      # TPM responses inside the firmware; TCG is reliable and fast enough.
      - name: boot scenarios (${{ matrix.group }})
        run: PAGURO_QEMU_ACCEL=tcg test/qemu/run.sh ${{ matrix.scenarios }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-serial-logs-${{ strategy.job-index }}
          path: target/qemu/*.log

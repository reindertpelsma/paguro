name: kernel

# The kernel module: its trusted core (pg_range.c, pg_claim.c, pg_ntfs.c)
# tested the way filesystems are tested against damaged images, then the
# module itself in a throwaway VM. INTERFACES.md §10, §12.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: longer fuzzing

concurrency:
  # a newer push to the same branch supersedes a run still queued or running;
  # scheduled (nightly) runs are never cancelled
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  core-c:
    name: core — C tests, sanitizers, analysers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang, valgrind and the analysers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm valgrind cppcheck sparse
      - name: unit tests + every fixture + full mutation sweep (ASan + UBSan)
        run: make -C kernel/dm-paguro/test/unit check
      - name: MemorySanitizer
        run: make -C kernel/dm-paguro/test/unit msan
      - name: Valgrind
        run: make -C kernel/dm-paguro/test/unit valgrind
      - name: gcc -fanalyzer, clang --analyze, cppcheck, sparse
        run: make -C kernel/dm-paguro/test/unit analyze
      - name: coverage of the core
        run: make -C kernel/dm-paguro/test/unit coverage
      - uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: kernel/dm-paguro/test/unit/coverage.txt

  cbmc:
    name: core — bounded model checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cbmc
      - run: make -C kernel/dm-paguro/test/cbmc

  differential:
    name: core — C against the Rust specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fixtures, exhaustive byte mutation, truncation, I/O faults, corpora
        run: cargo run --release -p paguro-harness -- ntfs-exhaustive
      - name: random rounds (range, NTFS, claims, runlists)
        run: cargo run --release -p paguro-harness -- 1000000

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [c-ntfs, c-runlist, c-payload, ntfs_file, runlist, ntfs_diff]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: time budget
        run: echo "SECS=${{ github.event_name == 'schedule' && 1200 || 60 }}" >> "$GITHUB_ENV"
      - name: libFuzzer on the C core (ASan + UBSan)
        if: startsWith(matrix.target, 'c-')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang
          t=${{ matrix.target }}
          make -C kernel/dm-paguro/test/fuzz run T=${t#c-} SECS=$SECS
      - name: cargo-fuzz on the Rust specification
        if: ${{ !startsWith(matrix.target, 'c-') }}
        run: |
          cargo install cargo-fuzz --locked
          cd fuzz
          seeds=../kernel/dm-paguro/test/fuzz/corpus/ntfs
          [ ${{ matrix.target }} = runlist ] && seeds=../kernel/dm-paguro/test/fuzz/corpus/runlist
          [ ${{ matrix.target }} = ntfs_diff ] && seeds="$seeds ../kernel/dm-paguro/test/fuzz/corpus/payload"
          mkdir -p corpus/${{ matrix.target }}
          # +nightly: rust-toolchain.toml pins stable, and cargo-fuzz needs -Z flags.
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} $seeds -- \
            -dict=../kernel/dm-paguro/test/fuzz/ntfs.dict -max_len=131072 \
            -max_total_time=$SECS -print_final_stats=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts
            kernel/dm-paguro/test/fuzz/crash-*

  module:
    name: module build + VM test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install build and VM-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-headers-$(uname -r) qemu-system-x86 \
            busybox-static dmsetup zstd cpio
      # The VM boots Ubuntu's generic HWE kernel, not the runner's own Azure
      # kernel: the Azure flavour keeps ntfs3 in linux-modules-extra, and on
      # its 6.17 series an O_DIRECT bio to a device with ntfs3 mounted falls
      # back to buffered I/O when the page cache cannot be invalidated, so the
      # direct-I/O refusal checks never reach the target. The packages are
      # only unpacked (dpkg -x), never installed or loaded on the runner.
      - name: fetch the VM kernel (generic HWE image, modules, headers)
        run: |
          kver=$(apt-cache depends linux-image-generic-hwe-24.04 |
                 sed -n 's/^ *Depends: linux-image-\([0-9].*-generic\)$/\1/p' | head -1)
          [ -n "$kver" ] || { echo "::error::cannot resolve the HWE kernel version"; exit 1; }
          common=$(apt-cache depends linux-headers-$kver |
                   sed -n 's/^ *Depends: \(linux-.*-headers-.*\)$/\1/p' | head -1)
          d=$RUNNER_TEMP/vmk; mkdir -p $d/debs; cd $d/debs
          apt-get download linux-image-unsigned-$kver linux-modules-$kver \
            linux-headers-$kver $common
          for f in *.deb; do dpkg -x $f $d; done
          ls $d/lib/modules/$kver/kernel/fs/ntfs3/ntfs3.ko* \
             $d/lib/modules/$kver/kernel/drivers/md/dm-log-writes.ko*
          echo "VMK=$d" >> "$GITHUB_ENV"; echo "KVER=$kver" >> "$GITHUB_ENV"
          echo "VM kernel: $kver (runner: $(uname -r))"
      - name: enable KVM if the runner has it (else TCG)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: build dm-paguro against the runner's kernel (W=1)
        run: make -C kernel/dm-paguro W=1 2>&1 | tee build.log && ! grep -E "(warning|error):" build.log | grep -v "compiler differs\|pahole"
      - name: build dm-paguro against the VM kernel (W=1)
        run: |
          make -C kernel/dm-paguro clean
          make -C kernel/dm-paguro KDIR=$VMK/usr/src/linux-headers-$KVER W=1 2>&1 | tee build-vm.log &&
            ! grep -E "(warning|error):" build-vm.log | grep -v "compiler differs\|pahole"
      - name: build pgctl (static)
        run: gcc -static -O2 -Wall -Wextra -Werror -o kernel/dm-paguro/tools/pgctl kernel/dm-paguro/tools/pgctl.c
      - name: build the harness (for the read-error sweep)
        run: cargo build --release -p paguro-harness
      - name: load and exercise it in a throwaway VM
        run: sudo kernel/dm-paguro/test/vm-test.sh "$VMK/boot/vmlinuz-$KVER" "$VMK/lib/modules/$KVER"

  # Views A and C of one NTFS volume live at once under stress, growth,
  # the view-C guard (BPF-LSM) and power-loss replay of everything recorded
  # (INTERFACES 10.4, 12.1): kernel/dm-paguro/test/vm-coexist.sh. Longer
  # stress and a denser replay nightly.
  coexist:
    name: module — coexistence, growth, guard, power-loss replay (VM)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 360 || 100 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install build, VM-test and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 busybox-static dmsetup zstd cpio \
            e2fsprogs ntfs-3g dosfstools gdisk fio attr clang llvm \
            libbpf-dev libelf-dev zlib1g-dev libzstd-dev
          sudo apt-get install -y -qq bpftool || sudo apt-get install -y -qq linux-tools-common || true
      - name: fetch the VM kernel (generic HWE image, modules, headers)
        run: |
          kver=$(apt-cache depends linux-image-generic-hwe-24.04 |
                 sed -n 's/^ *Depends: linux-image-\([0-9].*-generic\)$/\1/p' | head -1)
          [ -n "$kver" ] || { echo "::error::cannot resolve the HWE kernel version"; exit 1; }
          common=$(apt-cache depends linux-headers-$kver |
                   sed -n 's/^ *Depends: \(linux-.*-headers-.*\)$/\1/p' | head -1)
          d=$RUNNER_TEMP/vmk; mkdir -p $d/debs; cd $d/debs
          apt-get download linux-image-unsigned-$kver linux-modules-$kver \
            linux-headers-$kver $common
          for f in *.deb; do dpkg -x $f $d; done
          echo "VMK=$d" >> "$GITHUB_ENV"; echo "KVER=$kver" >> "$GITHUB_ENV"
      - name: enable KVM if the runner has it (else TCG)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: ntfsck (ntfsprogs-plus), built from source
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq autoconf automake libtool pkg-config libgcrypt20-dev
          git clone -q --depth 1 https://github.com/ntfsprogs-plus/ntfsprogs-plus.git $RUNNER_TEMP/npp
          cd $RUNNER_TEMP/npp && ./autogen.sh > /dev/null && ./configure -q --disable-shared --enable-static && make -s -j4
          f=$(find $RUNNER_TEMP/npp -name ntfsck -type f -perm -u+x | head -1)
          [ -n "$f" ] && echo "PG_NTFSCK=$f" >> "$GITHUB_ENV"
      - name: build dm-paguro (VM kernel), pgctl, pgguard, the harness
        run: |
          make -C kernel/dm-paguro KDIR=$VMK/usr/src/linux-headers-$KVER
          make -C kernel/dm-paguro/tools
          cargo build --release -p paguro-harness
      - name: coexistence, growth, guard and replay in a throwaway VM
        env:
          # Push: every 80th flush point (~300 states over the whole log) and
          # a few subsets. Nightly: every other flush point, every 1000th
          # write, subsets in a fifth of the flush intervals.
          PG_SCALE: ${{ github.event_name == 'schedule' && 2 || 1 }}
          PG_REPLAY: ${{ github.event_name == 'schedule' && '--flush-every 2 --every 1000 --subsets 20 --torn 30 --seed 7' || '--flush-every 80 --subsets 2 --torn 25 --seed 1' }}
          PG_EFSCK: ${{ github.event_name == 'schedule' && 50 || 20 }}
        run: |
          mkdir -p $RUNNER_TEMP/co
          sudo -E PG_WORK=$RUNNER_TEMP/co kernel/dm-paguro/test/vm-coexist.sh \
            "$VMK/boot/vmlinuz-$KVER" "$VMK/lib/modules/$KVER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coexist-log
          path: ${{ runner.temp }}/co/log

  # /dev/paguro, the dm table lines and /dev/paguro-handoff as a hostile
  # caller sees them (INTERFACES 12.0) on a debug kernel: KASAN + UBSAN +
  # lockdep + kmemleak on every push, KCSAN nightly. The kernel is built
  # once and cached (test/hostile/build-kernel.sh).
  hostile:
    name: module — hostile callers, DoS (${{ matrix.flavour }} kernel)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ github.event_name == 'schedule' && fromJSON('["kasan","kcsan"]') || fromJSON('["kasan"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: install kernel-build and VM-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libelf-dev libssl-dev \
            qemu-system-x86 ovmf busybox-static dmsetup cpio zstd
      - name: enable KVM if the runner has it (else TCG)
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kdebug/${{ matrix.flavour }}/out
          key: kdebug-${{ matrix.flavour }}-${{ hashFiles('kernel/dm-paguro/test/hostile/build-kernel.sh', 'kernel/dm-paguro/test/hostile/*.config') }}
      - name: debug kernel (cached)
        run: |
          d=$RUNNER_TEMP/kdebug/${{ matrix.flavour }}
          if [ ! -s $d/out/bzImage ]; then
            kernel/dm-paguro/test/hostile/build-kernel.sh ${{ matrix.flavour }} $d/work
            mkdir -p $d/out && cp -a $d/work/bzImage $d/work/build $d/work/version $d/out/
          fi
      - name: hostile callers in a throwaway VM
        run: |
          mkdir -p $RUNNER_TEMP/hlogs
          sudo -E PG_HOSTILE_LOGS=$RUNNER_TEMP/hlogs PG_VM_MEM=4096 \
            PG_HOSTILE_SECS=${{ github.event_name == 'schedule' && 120 || 30 }} \
            PG_HOSTILE_FUZZ=${{ github.event_name == 'schedule' && 1000000 || 200000 }} \
            kernel/dm-paguro/test/hostile/vm-hostile.sh $RUNNER_TEMP/kdebug/${{ matrix.flavour }}/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hostile-logs-${{ matrix.flavour }}
          path: ${{ runner.temp }}/hlogs

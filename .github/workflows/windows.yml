name: windows

# The Windows side (INTERFACES.md §11): paguro.exe, paguro-service, the API
# contract, the PaguroTools module and the minifilter. Safe real-API tests only: NOTHING here writes a firmware
# variable, a boot entry or the ESP of the runner — those paths are covered by
# the mock tests, which run everywhere.

on:
  push:
    paths:
      - 'crates/paguro-win/**'
      - 'crates/paguro-service/**'
      - 'crates/paguro-core/**'
      - 'crates/paguro-crypto/**'
      - 'crates/paguro-boot/**'
      - 'windows/**'
      - 'themes/default/strings/**'
      - 'fuzz/fuzz_targets/win_formats.rs'
      - '.github/workflows/windows.yml'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: paguro.exe and paguro-service (build, clippy, mock, real-API and pipe tests)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p paguro-win -p paguro-service --all-targets -- -D warnings
      - name: tests (mock machine, and real Win32 in tests/real_api.rs; the runner is elevated)
        run: cargo test -p paguro-win -- --nocapture
      - name: service tests (the pipe, its ACL, callers as a filtered administrator and as a standard user)
        env:
          PAGURO_PIPE_ACCOUNT_TESTS: '1'
        run: cargo test -p paguro-service -- --nocapture --test-threads=1
      - run: cargo build -p paguro-win -p paguro-service --release
      - name: the CLI runs read-only commands on the runner
        shell: pwsh
        run: |
          $exe = "target\release\paguro.exe"
          & $exe --json status | Tee-Object status.json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "status exited $LASTEXITCODE" }
          $s = Get-Content status.json -Raw | ConvertFrom-Json
          if ($s.schema -ne 'paguro-cli/1') { throw 'schema' }
          & $exe --json hw export -o "$env:RUNNER_TEMP\host-hardware.json"
          if ($LASTEXITCODE -ne 0) { throw "hw export exited $LASTEXITCODE" }
          Get-Content "$env:RUNNER_TEMP\host-hardware.json"
          & $exe --json --dry-run disk create --size 1G --path "$env:RUNNER_TEMP\x.vhd"
          if ($LASTEXITCODE -ne 0) { throw "dry-run disk create exited $LASTEXITCODE" }
          & $exe --json disk create --size 64M --path "$env:RUNNER_TEMP\real.vhd"
          if ($LASTEXITCODE -ne 0) { throw "disk create exited $LASTEXITCODE" }
          & $exe --json disk inspect "$env:RUNNER_TEMP\real.vhd"
          if ($LASTEXITCODE -ne 0) { throw "disk inspect exited $LASTEXITCODE" }
      - name: the real service - install it, call it through paguro.exe, remove it
        shell: pwsh
        run: |
          $exe = (Resolve-Path target\release\paguro.exe).Path
          $svc = (Resolve-Path target\release\paguro-service.exe).Path
          & $exe --direct service install --exe $svc
          if ($LASTEXITCODE -ne 0) { throw "service install exited $LASTEXITCODE" }
          sc.exe query paguro
          try {
            $info = & $exe --json service info | ConvertFrom-Json
            if (-not $info.data.service) { throw 'service info was not answered by the service' }
            "caller: $($info.data.caller | ConvertTo-Json -Compress)"
            if (-not $info.data.caller.elevated) { throw 'the elevated runner was not seen as elevated' }
            $a = & $exe --json status | ConvertFrom-Json
            $b = & $exe --json --direct status | ConvertFrom-Json
            if (($a.data.uefi -ne $b.data.uefi) -or ($a.data.arch -ne $b.data.arch) -or ($a.data.firmware.secure_boot -ne $b.data.firmware.secure_boot)) {
              throw 'status through the service differs from direct'
            }
            & $exe --json checks list | Tee-Object checks.json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "checks list exited $LASTEXITCODE" }
            & $exe --json --dry-run disk create --size 1G --path relative.vhd | Tee-Object dry.json | Out-Null
            $d = Get-Content dry.json -Raw | ConvertFrom-Json
            if (-not ([System.IO.Path]::IsPathRooted($d.data.path))) { throw "a relative path reached the service unresolved: $($d.data.path)" }
          } finally {
            Get-Content "$env:ProgramData\paguro\service.log" -ErrorAction SilentlyContinue
            & $exe --direct service uninstall
          }
          if ((sc.exe query paguro | Out-String) -notmatch '1060') { throw 'the service is still registered' }
      - uses: actions/upload-artifact@v4
        with:
          name: paguro-exe
          path: |
            target/release/paguro.exe
            target/release/paguro-service.exe
            status.json
            checks.json

  pester:
    name: PaguroTools binary module (Pester, fake service and the real service --mock)
    needs: rust
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: paguro-exe
          path: bin
      - name: build the module and the fake service
        working-directory: windows
        run: |
          dotnet publish PaguroTools/PaguroTools.csproj -c Release -m:1 -o PaguroTools/bin/module
          dotnet build dotnet/Paguro.Testing -c Release -m:1 -o PaguroTools/bin/testing
      - name: Pester 5 (pwsh 7.4); the service's demo machine on a pipe for the end-to-end block
        shell: pwsh
        run: |
          $svc = Start-Process -PassThru -NoNewWindow (Resolve-Path bin\target\release\paguro-service.exe).Path -ArgumentList 'console', '--mock', '--pipe', 'paguro-e2e'
          $env:PAGURO_SERVICE_PIPE = 'paguro-e2e'
          try {
            Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
            Import-Module Pester -MinimumVersion 5.5
            $c = New-PesterConfiguration
            $c.Run.Path = 'windows/PaguroTools/Tests'
            $c.Run.Exit = $true
            $c.Output.Verbosity = 'Detailed'
            Invoke-Pester -Configuration $c
          } finally { Stop-Process -Id $svc.Id -ErrorAction SilentlyContinue }

  api:
    name: API contract, method coverage, PaguroTools on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: C# types generated from paguro-api.json; fixtures round-trip; client over a pipe
        working-directory: windows/dotnet
        run: dotnet test Paguro.Api.Tests -m:1 --logger "console;verbosity=normal"
      - uses: dtolnay/rust-toolchain@stable
      - name: build the module, the fake service and paguro-service
        run: |
          dotnet publish windows/PaguroTools/PaguroTools.csproj -c Release -m:1 -o windows/PaguroTools/bin/module
          dotnet build windows/dotnet/Paguro.Testing -c Release -m:1 -o windows/PaguroTools/bin/testing
          cargo build -p paguro-service
      - name: every API method has a CLI command and a cmdlet (nothing is GUI-only)
        shell: pwsh
        run: |
          cargo test -p paguro-win --test api_contract -- every_method_has_a_cli_command methods_match_the_schema
          if ($LASTEXITCODE) { throw 'a method without a CLI command' }
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser
          $c = New-PesterConfiguration
          $c.Run.Path = 'windows/PaguroTools/Tests'
          $c.Filter.FullName = '*exports a cmdlet for every API method*'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: Pester on Linux (.NET pipes are Unix sockets), with paguro-service --mock for the end-to-end block
        shell: pwsh
        run: |
          $svc = Start-Process -PassThru target/debug/paguro-service -ArgumentList 'console', '--mock', '--unix', '/tmp/CoreFxPipe_paguro-e2e'
          $env:PAGURO_SERVICE_PIPE = 'paguro-e2e'
          Start-Sleep 1
          try {
            $c = New-PesterConfiguration
            $c.Run.Path = 'windows/PaguroTools/Tests'
            $c.Run.Exit = $true
            Invoke-Pester -Configuration $c
          } finally { Stop-Process -Id $svc.Id -ErrorAction SilentlyContinue }

  linux:
    name: cross-compile, SMBIOS parser (ASan/UBSan), fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: paguro.exe and paguro-service cross-compile (x86_64-pc-windows-gnu)
        run: cargo build -p paguro-win -p paguro-service --target x86_64-pc-windows-gnu
      - name: the driver's user-mode test program cross-compiles
        run: >
          x86_64-w64-mingw32-gcc -municode -Wall -Wextra -Werror -D_WIN32_WINNT=0x0A00
          -Iwindows/minifilter windows/minifilter/test/pgflt_test.c -lfltlib -o pgflt_test.exe
      - name: SMBIOS marker parser (gcc and clang, sanitizers)
        run: |
          for cc in gcc clang; do
            $cc -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all \
              -Iwindows/minifilter windows/minifilter/pg_smbios.c windows/minifilter/test/smbios_test.c -o smbios_test
            ./smbios_test
          done
      - uses: dtolnay/rust-toolchain@nightly
      - run: command -v cargo-fuzz || cargo install cargo-fuzz --locked
      - name: fuzz win_formats (60 s)
        working-directory: fuzz
        run: cargo +nightly fuzz run win_formats corpus/win_formats -- -max_total_time=60

  driver:
    name: minifilter (build, /analyze, test-sign, load inert and active, deny-path tests)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: WDK present? (else restore it from NuGet)
        shell: pwsh
        working-directory: windows/minifilter
        run: |
          $h = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\fltKernel.h" -ErrorAction SilentlyContinue
          if ($h) { "installed WDK: $($h.FullName -join ', ')" }
          else {
            "no installed WDK: restoring Microsoft.Windows.WDK.x64 from NuGet"
            nuget restore packages.config -PackagesDirectory packages
            Get-ChildItem packages -Recurse -Filter *.props | Select-Object -ExpandProperty FullName
          }
      - name: build Debug and Release (warnings are errors), /analyze on Release
        working-directory: windows/minifilter
        run: |
          msbuild paguro_flt.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /v:m
          msbuild paguro_flt.vcxproj /p:Configuration=Release /p:Platform=x64 /p:RunCodeAnalysis=true /m /v:m
      - name: user-mode tests build (cl)
        shell: cmd
        working-directory: windows/minifilter/test
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W4 /WX /I.. ..\pg_smbios.c smbios_test.c /Fe:smbios_test.exe || exit /b 1
          smbios_test.exe || exit /b 1
          cl /nologo /W4 /WX /DUNICODE /D_UNICODE /I.. pgflt_test.c fltlib.lib /Fe:pgflt_test.exe || exit /b 1
      - name: test-sign (self-signed certificate, trusted on this runner only)
        shell: pwsh
        working-directory: windows/minifilter
        run: |
          bcdedit /enum | Select-String -Pattern 'testsigning' | ForEach-Object { "boot: $_" }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=paguro test signing' `
            -CertStoreLocation Cert:\LocalMachine\My -HashAlgorithm SHA256
          Export-Certificate -Cert $cert -FilePath paguro-test.cer | Out-Null
          Import-Certificate -FilePath paguro-test.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath paguro-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x86\Inf2Cat.exe" | Sort-Object FullName | Select-Object -Last 1
          foreach ($cfg in 'Debug', 'Release') {
            $d = "pkg\$cfg"
            New-Item -ItemType Directory -Force $d | Out-Null
            Copy-Item "x64\$cfg\paguro_flt.sys", paguro_flt.inf $d
            & $kit.FullName sign /fd sha256 /sha1 $cert.Thumbprint /sm /s My "$d\paguro_flt.sys"
            if ($LASTEXITCODE) { throw 'signtool (sys)' }
            & $inf2cat.FullName /driver:$d /os:10_X64 /verbose
            if ($LASTEXITCODE) { throw 'inf2cat' }
            & $kit.FullName sign /fd sha256 /sha1 $cert.Thumbprint /sm /s My "$d\paguro_flt.cat"
            if ($LASTEXITCODE) { throw 'signtool (cat)' }
          }
      - name: install (Release) and load INERT — the runner has no paguro-vm/1 marker
        shell: pwsh
        working-directory: windows/minifilter
        run: |
          pnputil /add-driver pkg\Release\paguro_flt.inf /install
          if ($LASTEXITCODE) {
            "pnputil did not install the primitive driver ($LASTEXITCODE); InstallHinfSection instead"
            rundll32.exe setupapi.dll,InstallHinfSection DefaultInstall.NTamd64 132 "$PWD\pkg\Release\paguro_flt.inf"
            Start-Sleep 3
          }
          sc.exe qc PaguroFlt
          sc.exe start PaguroFlt
          if ($LASTEXITCODE) { throw "sc start: $LASTEXITCODE" }
          fltmc filters
          if ((fltmc filters) -match 'PaguroFlt') { throw 'inert driver registered a filter' }
          test\pgflt_test.exe inert
          if ($LASTEXITCODE) { throw 'pgflt_test inert' }
          # Not registered with the filter manager, so fltmc cannot unload it
          # (0x801f0013, filter not found); sc stop is its unload path.
          "fltmc unload on the inert driver (informational):"
          fltmc unload PaguroFlt; "exit $LASTEXITCODE"
          sc.exe stop PaguroFlt
          sc.exe query PaguroFlt
          if (-not ((sc.exe query PaguroFlt | Out-String) -match 'STOPPED')) { throw 'inert driver did not stop' }
      - name: load ACTIVE (Debug build, Parameters\ForceVmMode=1) and run every deny path
        shell: pwsh
        working-directory: windows/minifilter
        run: |
          $svc = 'HKLM:\SYSTEM\CurrentControlSet\Services\PaguroFlt'
          New-Item "$svc\Parameters" -Force | Out-Null
          New-ItemProperty "$svc\Parameters" -Name ForceVmMode -PropertyType DWord -Value 1 -Force | Out-Null
          $sys = (Resolve-Path pkg\Debug\paguro_flt.sys).Path
          Set-ItemProperty $svc -Name ImagePath -Value "\??\$sys"
          fltmc load PaguroFlt
          if ($LASTEXITCODE) { throw "fltmc load: $LASTEXITCODE" }
          fltmc filters
          fltmc instances -f PaguroFlt
          "sc stop must be refused while active:"
          sc.exe stop PaguroFlt; "exit $LASTEXITCODE"
          $dir = Join-Path $env:SystemDrive 'pgflt-test'
          New-Item -ItemType Directory -Force $dir | Out-Null
          test\pgflt_test.exe active $dir
          $rc = $LASTEXITCODE
          fltmc filters
          if ($rc) { throw "pgflt_test active: $rc failure(s)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paguro-minifilter
          path: |
            windows/minifilter/pkg
            windows/minifilter/test/*.exe
            windows/minifilter/x64/Release/*.xml

  codeql:
    name: CodeQL (C, the driver and its tests)
    runs-on: windows-2022
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: build
        shell: pwsh
        working-directory: windows/minifilter
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\fltKernel.h" -ErrorAction SilentlyContinue)) {
            nuget restore packages.config -PackagesDirectory packages
          }
          msbuild paguro_flt.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m
      - uses: github/codeql-action/analyze@v3

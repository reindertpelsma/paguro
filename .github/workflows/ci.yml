name: ci

on:
  push:
  pull_request:

concurrency:
  # a newer push to the same branch supersedes a run still queued or running;
  # scheduled (nightly) runs are never cancelled
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-uefi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: range model + C-vs-Rust differential (1M rounds)
        run: cargo run --release -p paguro-harness -- 1000000
      # The loader's build, boot tests, fuzzing and QEMU runs live in loader.yml.

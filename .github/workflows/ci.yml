name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-uefi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: range model + C-vs-Rust differential (1M rounds)
        run: cargo run --release -p paguro-harness -- 1000000
      - name: build the loader
        run: cargo build --release -p paguro-efi --target x86_64-unknown-uefi
      - name: boot the loader under OVMF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf
          mkdir -p esp/EFI/BOOT
          cp target/x86_64-unknown-uefi/release/paguro.efi esp/EFI/BOOT/BOOTX64.EFI
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          timeout 90 qemu-system-x86_64 -machine q35 -m 256 -display none \
            -serial file:serial.log -no-reboot -net none \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive format=raw,file=fat:rw:esp || true
          grep -a "paguro 0.0.0" serial.log
      - uses: actions/upload-artifact@v4
        with:
          name: paguro.efi
          path: target/x86_64-unknown-uefi/release/paguro.efi

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install build and VM-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-headers-$(uname -r) qemu-system-x86 \
            busybox-static dmsetup zstd cpio
      - name: build dm-paguro against the runner's kernel
        run: make -C kernel/dm-paguro
      - name: load and exercise it in a throwaway VM
        run: sudo kernel/dm-paguro/test/vm-test.sh

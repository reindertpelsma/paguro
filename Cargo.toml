[workspace]
resolver = "3"
members = [
    "crates/paguro-core",
    "crates/paguro-boot",
    "crates/paguro-crypto",
    "crates/paguro-efi",
    "crates/paguro-initrd",
    "crates/paguro-win",
    "crates/paguro-harness",
    "crates/paguro-theme",
    "crates/paguro-ui",
    "crates/paguro-ui-preview",
    "test/qemu/runner",
    "test/uefi-probe",
]
# paguro-efi and paguro-probe only build for x86_64-unknown-uefi; see its README.
default-members = [
    "crates/paguro-core",
    "crates/paguro-boot",
    "crates/paguro-crypto",
    "crates/paguro-initrd",
    "crates/paguro-win",
    "crates/paguro-harness",
    "crates/paguro-theme",
    "crates/paguro-ui",
    "crates/paguro-ui-preview",
    "test/qemu/runner",
]

[workspace.package]
license = "Apache-2.0 OR GPL-2.0-only"
edition = "2024"
version = "0.0.0"
publish = false
rust-version = "1.85"

[workspace.dependencies]
paguro-core = { path = "crates/paguro-core" }
paguro-crypto = { path = "crates/paguro-crypto" }
paguro-boot = { path = "crates/paguro-boot" }
paguro-theme = { path = "crates/paguro-theme" }
paguro-ui = { path = "crates/paguro-ui" }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
indexing_slicing = "warn"

[profile.release]
panic = "abort"
lto = true

# The golden and property tests render full frames (up to 3840×2160) and
# hash them: unoptimised, that takes minutes.
[profile.dev.package.paguro-ui]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
# BitLocker tests stretch keys (2^20 SHA-256 rounds per attempt) and decrypt
# whole volumes.
[profile.dev.package.paguro-crypto]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3

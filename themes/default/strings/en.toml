# Every user-visible string of the graphical loader, in English.
# `{name}` is a placeholder filled at run time (numbers or names); the build
# rejects unknown placeholders and missing or unknown keys. A "\n" starts a
# new paragraph; lines are wrapped to the layout automatically.
#
# The file is shared with the Windows app: the loader reads [loader]
# (loader.* keys); [win] is the app's.


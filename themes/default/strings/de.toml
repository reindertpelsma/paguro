# Every user-visible string of the loader, in German (PAGURO_LANG=de).
# Same keys and placeholders as en.toml; the build refuses a missing or
# unknown key. key_w and key_r name the keys W and R the loader binds:
# they stay W and R in every language.
#
# Machine translation, pending native review.
#
# The file is shared with the Windows app: the loader reads [loader]
# (loader.* keys); [win] is the app's.


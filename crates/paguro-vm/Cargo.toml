[package]
name = "paguro-vm"
license.workspace = true
description = "The Windows VM launcher: the synthesised disk, FVE substitution, QEMU with the host's identity (DESIGN.md §4.3, §4.5, §6 The VM boot)"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
paguro-core.workspace = true
paguro-crypto.workspace = true
paguro-boot.workspace = true
paguro-initrd = { path = "../paguro-initrd" }
sha2.workspace = true
libc = "0.2"
serde_json = "1"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true

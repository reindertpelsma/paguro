[package]
name = "paguro-service"
license.workspace = true
description = "The paguro Windows service: the API of INTERFACES.md §11.7 as JSON-RPC 2.0 over \\\\.\\pipe\\paguro"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "paguro-service"
path = "src/main.rs"

[dependencies]
paguro-win = { path = "../paguro-win" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
paguro-core.workspace = true

[lints]
workspace = true

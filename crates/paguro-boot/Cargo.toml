[package]
name = "paguro-boot"
license.workspace = true
description = "The loader's logic as a stage machine over a Platform trait (DESIGN.md §4.1, §6)"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
paguro-core.workspace = true
paguro-crypto.workspace = true
sha2.workspace = true
hmac.workspace = true
zeroize = { version = "1", default-features = false }
# TPM session salting: ECDH with the SRK (P-256) and nothing else — no
# signature verification (TPM 2.0 Part 1 §19.6.13, Annex C.6.1).
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true

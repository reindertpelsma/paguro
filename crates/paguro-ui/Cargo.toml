[package]
name = "paguro-ui"
license.workspace = true
description = "The loader's graphical UI: compiled-in theme, layout, software rasteriser, prompt loop (INTERFACES.md §13)"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
paguro-boot.workspace = true
paguro-core.workspace = true

[build-dependencies]
paguro-theme.workspace = true

[dev-dependencies]
paguro-crypto.workspace = true
sha2 = { workspace = true, features = ["std"] }
hmac.workspace = true
png = "0.18"
# The shared mock TPM (paguro-boot/tests/mock) salts sessions.
p256 = { version = "0.14", default-features = false, features = ["arithmetic"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
